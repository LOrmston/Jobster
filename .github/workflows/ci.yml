name: CI

# Deploys are handled by Cloudflare's Git integration (Workers Builds),
# which runs `npx wrangler deploy` on every push to the production branch.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

